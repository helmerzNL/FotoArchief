name: fotoarchief

x-laravel-service: &laravel-service
  build:
    context: .
    dockerfile: ${APP_DOCKERFILE:-Dockerfile}
  image: ${APP_IMAGE:-fotoarchief-app:local}
  restart: unless-stopped
  volumes:
    - app-storage:/var/www/html/storage
  environment: &laravel-environment
    APP_NAME: FotoArchief
    APP_ENV: ${APP_ENV:-local}
    APP_DEBUG: ${APP_DEBUG:-false}
    APP_URL: ${APP_URL:-http://localhost:8080}
    APP_LOCALE: ${APP_LOCALE:-nl}
    APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-nl}
    LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    CACHE_STORE: ${CACHE_STORE:-file}
    SESSION_DRIVER: ${SESSION_DRIVER:-file}
    QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
    DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-180}
    REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
    REDIS_HOST: ${REDIS_HOST:-valkey}
    REDIS_PORT: ${REDIS_PORT:-6379}
    REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
    REDIS_QUEUE_RETRY_AFTER: ${REDIS_QUEUE_RETRY_AFTER:-180}
    APP_MAX_UPLOAD_BYTES: ${APP_MAX_UPLOAD_BYTES:-104857600}
    APP_MAX_IMAGE_PIXELS: ${APP_MAX_IMAGE_PIXELS:-80000000}
    APP_MAX_BATCH_UPLOAD_FILES: ${APP_MAX_BATCH_UPLOAD_FILES:-250}
    INGEST_SCANNER: ${INGEST_SCANNER:-none}
    CLAMAV_HOST: ${CLAMAV_HOST:-127.0.0.1}
    CLAMAV_PORT: ${CLAMAV_PORT:-3310}
    APP_WORKER_JOB_TIMEOUT_SECONDS: ${APP_WORKER_JOB_TIMEOUT_SECONDS:-120}
    OCR_ENABLED: ${OCR_ENABLED:-false}
    OCR_BINARY: ${OCR_BINARY:-tesseract}
    OCR_LANGUAGES: ${OCR_LANGUAGES:-nld+eng}
    OCR_TIMEOUT: ${OCR_TIMEOUT:-60}
    EXCHANGE_MAX_IMPORT_BYTES: ${EXCHANGE_MAX_IMPORT_BYTES:-5242880}
    EXCHANGE_MAX_IMPORT_ROWS: ${EXCHANGE_MAX_IMPORT_ROWS:-5000}
    EXCHANGE_SYNC_ANALYSIS_BYTES: ${EXCHANGE_SYNC_ANALYSIS_BYTES:-262144}
    EXCHANGE_MAX_EXPORT_ASSETS: ${EXCHANGE_MAX_EXPORT_ASSETS:-500}
    EXCHANGE_MAX_EXPORT_BYTES: ${EXCHANGE_MAX_EXPORT_BYTES:-1073741824}
    EXCHANGE_EXPORT_TTL_MINUTES: ${EXCHANGE_EXPORT_TTL_MINUTES:-120}
    EXCHANGE_DOWNLOAD_TTL_MINUTES: ${EXCHANGE_DOWNLOAD_TTL_MINUTES:-10}
    EXCHANGE_JOB_TIMEOUT_SECONDS: ${EXCHANGE_JOB_TIMEOUT_SECONDS:-120}
    EXCHANGE_STALE_CLAIM_SECONDS: ${EXCHANGE_STALE_CLAIM_SECONDS:-150}
    EXCHANGE_ABANDONED_CLAIM_SECONDS: ${EXCHANGE_ABANDONED_CLAIM_SECONDS:-1800}

services:
  app:
    <<: *laravel-service
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  worker:
    <<: *laravel-service
    command: ["php", "artisan", "queue:work", "ingest", "--sleep=3", "--tries=3", "--timeout=120"]
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: ${WORKER_REPLICAS:-1}

  scheduler:
    <<: *laravel-service
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fotoarchief}
      POSTGRES_USER: ${POSTGRES_USER:-fotoarchief}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:${VALKEY_VERSION:-7-alpine}
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "${VALKEY_BIND_ADDRESS:-127.0.0.1}:${VALKEY_PORT:-6379}:6379"
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app-storage:
  postgres-data:
  postgres-backups:
  valkey-data:
