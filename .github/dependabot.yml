# Dependabot works on the integration branch, like everyone else (App-Guidance
# project-baseline.md section 20): every entry targets `beta`, so version updates open their
# pull requests into `beta` and reach production only through a promotion to `main`.
# `.github/workflows/dependabot-auto-merge.yml` merges them into `beta` once Quality is green.
#
# `target-branch` does not apply to security updates: those use the repository's Default
# branch, which is therefore `beta` as well (a setting the owner makes on GitHub).
version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    target-branch: "beta"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns: ["*"]

  - package-ecosystem: "docker"         # the PHP/Apache base image in the Dockerfile
    directory: "/"
    target-branch: "beta"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "beta"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
