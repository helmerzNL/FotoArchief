name: Verified test release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  publish:
    name: Publish previously tested packages
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release identity
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          git merge-base --is-ancestor HEAD origin/main
          latest_tag="$(git tag --merged origin/main --list 'v*' --sort=-v:refname | head -n 1)"
          test "$GITHUB_REF_NAME" = "$latest_tag"
      - name: Validate version-specific bilingual release notes
        shell: bash
        run: sh scripts/check-release-notes.sh "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          name: fotoarchief-php-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: fotoarchief-docker-${{ github.sha }}
          path: dist
      - name: Verify artifacts before publication
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          sha256sum --check DOCKER-SHA256SUMS
      - name: Publish the image that passed acceptance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker load -i dist/fotoarchief-docker.tar.gz
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          image="$repository:$GITHUB_REF_NAME"
          latest_image="$repository:latest"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "fotoarchief-ci:$GITHUB_SHA" "$image"
          docker push "$image"
          docker tag "fotoarchief-ci:$GITHUB_SHA" "$latest_image"
          docker push "$latest_image"
          docker inspect --format '{{index .RepoDigests 0}}' "$image" > dist/IMAGE-DIGEST.txt
          printf 'APP_IMAGE=%s\n' "$image" > dist/IMAGE.txt
          printf 'APP_IMAGE=%s\n' "$latest_image" > dist/IMAGE-LATEST.txt
          docker logout ghcr.io
      - name: Create persistent test release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/DOCKER-SHA256SUMS >> dist/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --prerelease \
            --title "FotoArchief $GITHUB_REF_NAME — Testrelease / Test release" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" dist/*
