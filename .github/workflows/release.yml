name: Verified test release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  publish:
    name: Publish previously tested packages
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release identity
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          git merge-base --is-ancestor HEAD origin/main
          latest_tag="$(git tag --merged origin/main --list 'v*' --sort=-v:refname | head -n 1)"
          test "$GITHUB_REF_NAME" = "$latest_tag"
      - uses: actions/download-artifact@v4
        with:
          name: fotoarchief-php-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: fotoarchief-docker-${{ github.sha }}
          path: dist
      - name: Verify artifacts before publication
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          sha256sum --check DOCKER-SHA256SUMS
      - name: Publish the image that passed acceptance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker load -i dist/fotoarchief-docker.tar.gz
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          image="$repository:$GITHUB_REF_NAME"
          latest_image="$repository:latest"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "fotoarchief-ci:$GITHUB_SHA" "$image"
          docker push "$image"
          docker tag "fotoarchief-ci:$GITHUB_SHA" "$latest_image"
          docker push "$latest_image"
          docker inspect --format '{{index .RepoDigests 0}}' "$image" > dist/IMAGE-DIGEST.txt
          printf 'APP_IMAGE=%s\n' "$image" > dist/IMAGE.txt
          printf 'APP_IMAGE=%s\n' "$latest_image" > dist/IMAGE-LATEST.txt
          docker logout ghcr.io
      - name: Create persistent test release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-notes" <<'NOTES'
          ## Nederlands

          Testrelease met leesbare PHP en vergrendelde productieafhankelijkheden,
          een Compose-deploymentarchief en de Docker-image die door deze workflow
          is geaccepteerd. Dit is geen certificering van productierijpheid.

          Download IMAGE.txt en IMAGE-DIGEST.txt voor de onveranderlijke
          versie-tag en digest. IMAGE-LATEST.txt verwijst naar de rolling :latest-tag,
          die bij iedere geslaagde hoogste SemVer-release naar hetzelfde image wordt
          bijgewerkt. Gebruik voor reproduceerbare deployments bij voorkeur de
          versie-tag of digest. U kunt ook fotoarchief-docker.tar.gz laden met
          docker load en de APP_IMAGE-waarde uit IMAGE-LOCAL.txt gebruiken;
          registrycredentials zijn dan niet nodig. De PHP-host vereist PHP 8.5,
          PostgreSQL, de vereiste extensies en cron/workers. Stel de document root
          in op public/. Composer is niet nodig op de host.

          Operatorwijzigingen: stel APP_IMAGE in op de meegeleverde tag of digest.
          Laat DB_PASSWORD voor bestaande volumes ongewijzigd. Behoud app-storage
          en postgres-data. De HTTP-mapping blijft
          ${APP_BIND_ADDRESS:-127.0.0.1}:${APP_HTTP_PORT:-8080}:8080. Packaging
          introduceert geen nieuwe verplichte omgevingsvariabelen. Maak vóór een
          upgrade een geverifieerde backup en raadpleeg de operationele documentatie.
          De bestandslimiet van de applicatie is 104857600 bytes; iedere proxy moet
          minimaal 115343360 bytes per request en de ingestelde requestduur van
          300 seconden toestaan.

          ---

          ## English

          Test release containing readable PHP with locked production dependencies,
          a Compose deployment archive and the Docker image accepted by this
          workflow. This is not a production-readiness certification.

          Download IMAGE.txt and IMAGE-DIGEST.txt for the immutable version tag and
          digest. IMAGE-LATEST.txt references the rolling :latest tag, which is
          updated to the same image by every successful highest SemVer release. Prefer
          the version tag or digest for reproducible deployments. Alternatively,
          load fotoarchief-docker.tar.gz with docker load and use the APP_IMAGE value
          from IMAGE-LOCAL.txt; no registry credentials are required. The PHP host
          requires PHP 8.5, PostgreSQL, the required extensions and cron/workers.
          Set its document root to public/. Composer is not needed on the host.

          Operator changes: set APP_IMAGE to the supplied tag or digest. Keep
          DB_PASSWORD unchanged for existing volumes. Preserve app-storage and
          postgres-data. The HTTP mapping remains
          ${APP_BIND_ADDRESS:-127.0.0.1}:${APP_HTTP_PORT:-8080}:8080. Packaging
          introduces no new mandatory environment variables. Before upgrading,
          create a verified backup and consult the operational documentation.
          The application file limit is 104857600 bytes; every proxy must allow at
          least 115343360 bytes per request and the configured request duration of
          300 seconds.
          NOTES
          cat dist/DOCKER-SHA256SUMS >> dist/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --prerelease \
            --title "FotoArchief $GITHUB_REF_NAME — Testrelease / Test release" \
            --notes-file "$RUNNER_TEMP/release-notes" dist/*
