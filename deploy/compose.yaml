# Image-only deployment for Compose-compatible stack managers.
# Requires a published FotoArchief image; see ../docs/DEPLOYMENT_STACKS.md.
name: ${COMPOSE_PROJECT_NAME:-fotoarchief}

x-app: &app
  image: ${APP_IMAGE:?Set APP_IMAGE to a published image tag or digest}
  restart: unless-stopped
  volumes:
    - app-storage:/var/www/html/storage
  environment: &app-environment
    APP_NAME: FotoArchief
    APP_ENV: production
    APP_DEBUG: "false"
    APP_URL: ${APP_URL:-http://localhost:8080}
    APP_LOCALE: ${APP_LOCALE:-nl}
    APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-nl}
    DEPLOYMENT_MIGRATION_LOCK_TIMEOUT_SECONDS: ${DEPLOYMENT_MIGRATION_LOCK_TIMEOUT_SECONDS:-300}
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-}
    OPERATIONS_ALERTS_ENABLED: ${OPERATIONS_ALERTS_ENABLED:-false}
    OPERATIONS_ALERT_WEBHOOK_URL: ${OPERATIONS_ALERT_WEBHOOK_URL:-}
    OPERATIONS_ALERT_MINIMUM_SEVERITY: ${OPERATIONS_ALERT_MINIMUM_SEVERITY:-warning}
    OPERATIONS_ALERT_FAILED_INGEST_THRESHOLD: ${OPERATIONS_ALERT_FAILED_INGEST_THRESHOLD:-5}
    OPERATIONS_ALERT_PENDING_INGEST_THRESHOLD: ${OPERATIONS_ALERT_PENDING_INGEST_THRESHOLD:-100}
    AI_LOCAL_ENDPOINT: ${AI_LOCAL_ENDPOINT:-}
    AI_EXTERNAL_ENDPOINT: ${AI_EXTERNAL_ENDPOINT:-}
    AI_PROVIDER_REGION: ${AI_PROVIDER_REGION:-}
    AI_RETENTION_NOTICE: ${AI_RETENTION_NOTICE:-}
    AI_EXTERNAL_API_KEY: ${AI_EXTERNAL_API_KEY:-}
    AI_OPENAI_ENABLED: ${AI_OPENAI_ENABLED:-false}
    AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
    AI_OPENAI_BASE_URL: ${AI_OPENAI_BASE_URL:-https://api.openai.com/v1}
    AI_OPENAI_VISION_MODEL: ${AI_OPENAI_VISION_MODEL:-gpt-4.1-mini}
    AI_OPENAI_COST_CENTS_PER_IMAGE: ${AI_OPENAI_COST_CENTS_PER_IMAGE:-0}
    AI_OPENAI_MONTHLY_BUDGET_CENTS: ${AI_OPENAI_MONTHLY_BUDGET_CENTS:-0}
    AI_ANTHROPIC_ENABLED: ${AI_ANTHROPIC_ENABLED:-false}
    AI_ANTHROPIC_API_KEY: ${AI_ANTHROPIC_API_KEY:-}
    AI_ANTHROPIC_BASE_URL: ${AI_ANTHROPIC_BASE_URL:-https://api.anthropic.com}
    AI_ANTHROPIC_API_VERSION: ${AI_ANTHROPIC_API_VERSION:-2023-06-01}
    AI_ANTHROPIC_VISION_MODEL: ${AI_ANTHROPIC_VISION_MODEL:-claude-sonnet-5}
    AI_ANTHROPIC_COST_CENTS_PER_IMAGE: ${AI_ANTHROPIC_COST_CENTS_PER_IMAGE:-0}
    AI_ANTHROPIC_MONTHLY_BUDGET_CENTS: ${AI_ANTHROPIC_MONTHLY_BUDGET_CENTS:-0}
    AI_GEMINI_ENABLED: ${AI_GEMINI_ENABLED:-false}
    AI_GEMINI_API_KEY: ${AI_GEMINI_API_KEY:-}
    AI_GEMINI_BASE_URL: ${AI_GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
    AI_GEMINI_VISION_MODEL: ${AI_GEMINI_VISION_MODEL:-gemini-2.5-flash}
    AI_GEMINI_EMBEDDING_MODEL: ${AI_GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
    AI_GEMINI_COST_CENTS_PER_IMAGE: ${AI_GEMINI_COST_CENTS_PER_IMAGE:-0}
    AI_GEMINI_COST_CENTS_PER_EMBEDDING: ${AI_GEMINI_COST_CENTS_PER_EMBEDDING:-0}
    AI_GEMINI_MONTHLY_BUDGET_CENTS: ${AI_GEMINI_MONTHLY_BUDGET_CENTS:-0}
    AI_OPENROUTER_ENABLED: ${AI_OPENROUTER_ENABLED:-false}
    AI_OPENROUTER_API_KEY: ${AI_OPENROUTER_API_KEY:-}
    AI_OPENROUTER_BASE_URL: ${AI_OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
    AI_OPENROUTER_VISION_MODEL: ${AI_OPENROUTER_VISION_MODEL:-}
    AI_OPENROUTER_EMBEDDING_MODEL: ${AI_OPENROUTER_EMBEDDING_MODEL:-}
    AI_OPENROUTER_EMBEDDING_MODEL_ALLOWLIST: ${AI_OPENROUTER_EMBEDDING_MODEL_ALLOWLIST:-nvidia/llama-nemotron-embed-vl-1b-v2}
    AI_OPENROUTER_COST_CENTS_PER_IMAGE: ${AI_OPENROUTER_COST_CENTS_PER_IMAGE:-0}
    AI_OPENROUTER_COST_CENTS_PER_EMBEDDING: ${AI_OPENROUTER_COST_CENTS_PER_EMBEDDING:-0}
    AI_OPENROUTER_MONTHLY_BUDGET_CENTS: ${AI_OPENROUTER_MONTHLY_BUDGET_CENTS:-0}
    LOG_CHANNEL: stderr
    CACHE_STORE: ${CACHE_STORE:-file}
    SESSION_DRIVER: ${SESSION_DRIVER:-file}
    QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
    DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-180}
    REDIS_CLIENT: phpredis
    REDIS_HOST: ${REDIS_HOST:-valkey}
    REDIS_PORT: "6379"
    REDIS_QUEUE_RETRY_AFTER: ${REDIS_QUEUE_RETRY_AFTER:-180}
    APP_MAX_UPLOAD_BYTES: ${APP_MAX_UPLOAD_BYTES:-104857600}
    APP_MAX_IMAGE_PIXELS: ${APP_MAX_IMAGE_PIXELS:-80000000}
    APP_MAX_BATCH_UPLOAD_FILES: ${APP_MAX_BATCH_UPLOAD_FILES:-250}
    INGEST_SCANNER: ${INGEST_SCANNER:-none}
    CLAMAV_HOST: ${CLAMAV_HOST:-127.0.0.1}
    CLAMAV_PORT: ${CLAMAV_PORT:-3310}
    CLAMAV_TIMEOUT: ${CLAMAV_TIMEOUT:-30}
    APP_WORKER_JOB_TIMEOUT_SECONDS: ${APP_WORKER_JOB_TIMEOUT_SECONDS:-120}
    OCR_ENABLED: ${OCR_ENABLED:-false}
    OCR_BINARY: ${OCR_BINARY:-tesseract}
    OCR_LANGUAGES: ${OCR_LANGUAGES:-nld+eng}
    OCR_TIMEOUT: ${OCR_TIMEOUT:-60}
    EXCHANGE_MAX_IMPORT_BYTES: ${EXCHANGE_MAX_IMPORT_BYTES:-5242880}
    EXCHANGE_MAX_IMPORT_ROWS: ${EXCHANGE_MAX_IMPORT_ROWS:-5000}
    EXCHANGE_SYNC_ANALYSIS_BYTES: ${EXCHANGE_SYNC_ANALYSIS_BYTES:-262144}
    EXCHANGE_MAX_EXPORT_ASSETS: ${EXCHANGE_MAX_EXPORT_ASSETS:-500}
    EXCHANGE_MAX_EXPORT_BYTES: ${EXCHANGE_MAX_EXPORT_BYTES:-1073741824}
    EXCHANGE_EXPORT_TTL_MINUTES: ${EXCHANGE_EXPORT_TTL_MINUTES:-120}
    EXCHANGE_DOWNLOAD_TTL_MINUTES: ${EXCHANGE_DOWNLOAD_TTL_MINUTES:-10}
    EXCHANGE_JOB_TIMEOUT_SECONDS: ${EXCHANGE_JOB_TIMEOUT_SECONDS:-120}
    EXCHANGE_STALE_CLAIM_SECONDS: ${EXCHANGE_STALE_CLAIM_SECONDS:-150}
    EXCHANGE_ABANDONED_CLAIM_SECONDS: ${EXCHANGE_ABANDONED_CLAIM_SECONDS:-1800}

services:
  app:
    <<: *app
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "ingest", "--sleep=3", "--tries=3", "--timeout=120"]
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fotoarchief}
      POSTGRES_USER: ${POSTGRES_USER:-fotoarchief}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:7-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    profiles:
      - clamav
    environment:
      CLAMD_CONF_MaxFileSize: ${CLAMAV_MAX_FILE_SIZE:-110M}
      CLAMD_CONF_StreamMaxLength: ${CLAMAV_STREAM_MAX_LENGTH:-110M}
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version >/dev/null 2>&1 && clamdscan --no-summary /etc/hosts >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  app-storage:
  postgres-data:
  valkey-data:
  clamav-data:
