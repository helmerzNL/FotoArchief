# Image-only deployment for Compose-compatible stack managers.
# Requires a published FotoArchief image; see ../docs/DEPLOYMENT_STACKS.md.
name: ${COMPOSE_PROJECT_NAME:-fotoarchief}

x-app: &app
  image: ${APP_IMAGE:?Set APP_IMAGE to a published image tag or digest}
  restart: unless-stopped
  volumes:
    - app-storage:/var/www/html/storage
  environment: &app-environment
    APP_NAME: FotoArchief
    APP_ENV: production
    APP_DEBUG: "false"
    APP_URL: ${APP_URL:-http://localhost:8080}
    LOG_CHANNEL: stderr
    CACHE_STORE: ${CACHE_STORE:-file}
    SESSION_DRIVER: ${SESSION_DRIVER:-file}
    QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
    DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-180}
    REDIS_CLIENT: phpredis
    REDIS_HOST: ${REDIS_HOST:-valkey}
    REDIS_PORT: "6379"
    REDIS_QUEUE_RETRY_AFTER: ${REDIS_QUEUE_RETRY_AFTER:-180}
    APP_MAX_UPLOAD_BYTES: ${APP_MAX_UPLOAD_BYTES:-104857600}
    APP_MAX_IMAGE_PIXELS: ${APP_MAX_IMAGE_PIXELS:-80000000}
    APP_MAX_BATCH_UPLOAD_FILES: ${APP_MAX_BATCH_UPLOAD_FILES:-250}
    INGEST_SCANNER: ${INGEST_SCANNER:-none}
    CLAMAV_HOST: ${CLAMAV_HOST:-127.0.0.1}
    CLAMAV_PORT: ${CLAMAV_PORT:-3310}
    APP_WORKER_JOB_TIMEOUT_SECONDS: ${APP_WORKER_JOB_TIMEOUT_SECONDS:-120}

services:
  app:
    <<: *app
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "ingest", "--sleep=3", "--tries=3", "--timeout=120"]
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fotoarchief}
      POSTGRES_USER: ${POSTGRES_USER:-fotoarchief}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:7-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app-storage:
  postgres-data:
  valkey-data:
